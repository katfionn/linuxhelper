<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linux 使用助手</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">🐧</div>
          <div class="brand-text">
            <strong>Linux 使用助手</strong>
            <span>Linux Helper</span>
          </div>
        </div>

        <nav class="nav" id="nav">
          <a class="nav-item" href="#/home" data-route="home">
            <span class="nav-icon" data-icon="home"></span><span>首页</span>
          </a>
          <a class="nav-item" href="#/ai" data-route="ai">
            <span class="nav-icon" data-icon="sparkles"></span><span>AI 助手</span><em class="nav-dot" id="ai-nav-dot"></em>
          </a>
          <a class="nav-item" href="#/store" data-route="store">
            <span class="nav-icon" data-icon="store"></span><span>应用市场</span>
          </a>
          <a class="nav-item" href="#/files" data-route="files">
            <span class="nav-icon" data-icon="search"></span><span>文件查找</span>
          </a>
          <a class="nav-item" href="#/knowledge" data-route="knowledge">
            <span class="nav-icon" data-icon="book"></span><span>Linux 知识</span>
          </a>
          <a class="nav-item" href="#/maintenance" data-route="maintenance">
            <span class="nav-icon" data-icon="wrench"></span><span>系统维护</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <a class="nav-item" href="#/settings" data-route="settings">
            <span class="nav-icon" data-icon="settings"></span><span>设置</span>
          </a>
          <div class="distro-pill" id="distro-pill" title="当前系统">
            <span class="pulse-dot"></span><span id="distro-name">检测中…</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-titles">
            <h1 id="page-title">首页</h1>
            <p id="page-sub">Linux 使用助手</p>
          </div>
          <div class="topbar-actions">
            <button class="chip chip-button" id="provider-chip" title="当前 AI 服务商">
              <span class="pulse-dot" id="provider-dot"></span><span id="provider-label">未配置 AI</span>
            </button>
            <button class="icon-button" id="btn-settings" title="设置" data-icon="settings"></button>
          </div>
        </header>
        <div class="demo-banner" id="demo-banner" hidden>
          <span>🧪 预览模式：当前不是 Linux 系统，系统级操作以模拟数据展示，安装后会连接真实系统。</span>
        </div>
        <div id="view" class="view"></div>
      </main>
    </div>

    <div id="toasts" class="toasts"></div>
    <div id="modal-root"></div>

    <script src="js/ui.js"></script>
    <script src="js/views/home.js"></script>
    <script src="js/views/ai.js"></script>
    <script src="js/views/store.js"></script>
    <script src="js/views/files.js"></script>
    <script src="js/views/knowledge.js"></script>
    <script src="js/views/maintenance.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

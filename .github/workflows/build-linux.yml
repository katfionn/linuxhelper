name: Build Linux packages

on:
  push:
    branches:
      - build
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/npm

      - name: Run tests
        run: npm test

      - name: Install packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            eb-${{ runner.os }}-

      - name: Build AppImage / deb / pacman
        run: npm run dist:linux -- --publish never

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.AppImage *.deb *.pacman > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload AppImage (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: linuxhelper-appimage-x86_64
          path: dist/*x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: linuxhelper-appimage-arm64
          path: dist/*arm64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload deb (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: linuxhelper-deb-amd64
          path: dist/*amd64.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload deb (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: linuxhelper-deb-arm64
          path: dist/*arm64.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload pacman (x64)
        uses: actions/upload-artifact@v4
        with:
          name: linuxhelper-pacman-x64
          path: dist/*.pacman
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: linuxhelper-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linuxhelper-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
